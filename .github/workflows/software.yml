name: Software verification
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/dashboard-web/package-lock.json
      - run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' ruff
      - run: python tools/validate_contracts.py
      - run: ruff check --select F,E9 retail tests services/dashboard-api/app tools/smoke.py tools/setup_tls.py tools/validate_contracts.py
      - run: docker compose -f infra/docker-compose.verify.yml up -d --wait
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://retail:retail_test_only@localhost:15432/retail_pricing_test
      - run: npm ci && npm run typecheck && npm run build
        working-directory: services/dashboard-web
      - if: always()
        run: docker compose -f infra/docker-compose.verify.yml down -v
