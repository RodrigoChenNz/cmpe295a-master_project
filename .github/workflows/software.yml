name: Software verification
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/dashboard-web/package-lock.json
      - run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]' ruff
      - run: python tools/validate_contracts.py
      - run: python tools/validate_ucp_vendor.py
      - run: ruff check --select F,E9 retail tests services/dashboard-api/app tools/setup_ucp.py tools/ucp_ready.py tools/validate_ucp_vendor.py tools/setup_commerce.py tools/commerce_ready.py tools/ready.py tools/smoke.py tools/setup_tls.py tools/validate_contracts.py
      - run: docker compose -f infra/docker-compose.verify.yml up -d --wait
      - run: python tools/setup_tls.py
      - run: docker compose -f infra/docker-compose.tls-test.yml up -d
      - run: python -m pytest -q
        env:
          TLS_TEST_PORT: 18884
          TEST_DATABASE_URL: postgresql://retail:retail_test_only@localhost:15432/retail_pricing_test
      - run: npm ci && npm run typecheck && npm run build
        working-directory: services/dashboard-web
      - run: python tools/setup_ucp.py
      - run: docker compose --env-file .env.deploy.local -f infra/docker-compose.deploy.yml -f infra/docker-compose.https-test.yml up -d --build --wait
      - run: python tools/ucp_ready.py
      - if: failure()
        run: docker compose --env-file .env.deploy.local -f infra/docker-compose.deploy.yml -f infra/docker-compose.https-test.yml logs --tail 80 api gateway
      - if: always()
        run: |
          docker compose -f infra/docker-compose.verify.yml down -v
          docker compose -f infra/docker-compose.tls-test.yml down
          if [ -f .env.deploy.local ]; then
            docker compose --env-file .env.deploy.local -f infra/docker-compose.deploy.yml -f infra/docker-compose.https-test.yml down -v
          fi
