; Shelf label (LoRa) on a Heltec Vision Master E213 or Wireless Paper. One
; build per board. Heltec has fitted both with either of two e-ink panels: the
; firmware detects which at boot (see PANEL in include/config.example.h).
;
;   pio run -e e213 -t upload             Vision Master E213
;   pio run -e wireless-paper -t upload   Wireless Paper (V1.1, V1.1.1, V1.2)
;   pio device monitor                    serial console

[platformio]
default_envs = e213

[env]
platform = espressif32@^6.9.0
; The Vision Master has no board definition of its own. The library author's
; guide uses this one: same ESP32-S3, same flash layout.
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ; The radio protocol, shared with edge/lora-gateway.
  -I ../common
lib_deps =
  ; From GitHub by tag: the registry stops at 4.5.0, and the V1.1 panel's
  ; driver (E0213A367) arrived in 4.6.0.
  https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
  jgromes/RadioLib@^7.1.0

[env:e213]
; USB straight into the ESP32-S3: the port drops while the label sleeps.
board_upload.use_1200bps_touch = true
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D Vision_Master_E213
  -D BOARD_E213

[env:wireless-paper]
; USB through a USB-serial chip: the port stays up while the label sleeps,
; so the serial console keeps working.
build_flags =
  ${env.build_flags}
  -D WIRELESS_PAPER
  -D BOARD_WIRELESS_PAPER
