; Heltec WiFi LoRa 32 as the shelf labels' LoRa gateway.
;
;   pio run -e v3 -t upload    WiFi LoRa 32 V3 (USB-C, CP2102 USB chip)
;   pio run -e v4 -t upload    WiFi LoRa 32 V4 (USB-C, native USB, RF amplifier)
;   pio device monitor         raw serial: JSON lines for the bridge, "# " lines for people
;
; See README.md, "Which board do I have?".

[platformio]
default_envs = v3

[env]
platform = espressif32@^6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  ; The radio protocol, shared with edge/eink-e213.
  -I ../common
lib_deps =
  jgromes/RadioLib@^7.1.0
  olikraus/U8g2@^2.35.0
  bblanchon/ArduinoJson@^7.2.0

[env:v3]
build_flags =
  ${env.build_flags}
  -D GW_BOARD=\"v3\"

[env:v4]
; PlatformIO has no V4 board definition yet. The V3 one fits: same ESP32-S3
; and pins. The V4 talks over the chip's own USB rather than a CP2102.
build_flags =
  ${env.build_flags}
  -D GW_BOARD=\"v4\"
  -D GW_V4
  -D ARDUINO_USB_CDC_ON_BOOT=1
