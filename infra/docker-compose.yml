# Integration harness for the whole system.
#
#   make up        start everything
#   make logs      follow
#   make down      stop and keep data
#   make nuke      stop and drop volumes
#
# Rule: a clean clone must come up with one command and no manual setup step.
# If you add a service, add it here — never to a personal script.
#
# Services are added as they are built (see the build order in the root README).
# mosquitto + postgres are step 1; dashboard-api and dashboard-web are commented
# out below and get uncommented when their Dockerfiles land.

name: retail-pricing

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: rp-mosquitto
    ports:
      - "1883:1883"   # MQTT
      - "9101:9001"   # MQTT over WebSocket (browser clients, MQTT Explorer).
                      # Host side is 9101, not 9001: 9001 collides with Penpot
                      # and other common local stacks. Container side stays 9001.
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: rp-postgres
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail_dev_only
      POSTGRES_DB: retail_pricing
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_pricing"]
      interval: 10s
      timeout: 5s
      retries: 5

  # dashboard-api:
  #   build: ../services/dashboard-api
