# Mosquitto — development configuration.
#
# WARNING: anonymous access is enabled. This is a lab broker on a private network.
# Before any deployment or public demo, switch to password_file + TLS as described
# in workbook Ch.5 (MQTT v5 over TLS 1.3).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Plain MQTT — pricing agent, forecaster, dashboard-api, edge gateway
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# MQTT over WebSocket — browser clients and MQTT Explorer
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Retained messages carry current price and inventory state to any node that
# connects late or reboots. Keep them small; they are per-topic, not a log.
max_queued_messages 1000
message_size_limit 16384
