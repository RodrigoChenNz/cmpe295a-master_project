[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfiq-software"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["aiomqtt>=2.3,<3", "asyncpg>=0.30,<1", "jsonschema>=4.23,<5", "numpy>=1.26,<3", "gymnasium>=1,<2", "stable-baselines3>=2.4,<3", "scikit-learn>=1.5,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
forecast = ["prophet>=1.1,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic-settings>=2.6,<3", "argon2-cffi>=23", "email-validator>=2"]

[project.scripts]
shelfiq = "retail.cli:main"

[tool.setuptools.packages.find]
include = ["retail*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "services/dashboard-api"]
